<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Basics Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="quiz-card">
      <p class="eyebrow">Interactive quiz</p>
      <h1>Web Basics Quiz</h1>
      <p id="progress" class="progress" aria-live="polite"></p>

      <section id="quiz" aria-live="polite">
        <h2 id="question"></h2>
        <div id="choices" class="choices"></div>
        <p id="feedback" class="feedback" role="status"></p>
        <button id="next-button" type="button" disabled>Next question</button>
      </section>

      <section id="results" class="hidden" aria-live="polite">
        <h2>Quiz complete! 🎉</h2>
        <p id="score"></p>
        <button id="restart-button" type="button">Try again</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
